<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<title>단어 퀘스트 · 씬잉글리쉬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7EF;
  --paper-2:#FFFFFF;
  --ink:#17161A;
  --ink-60:#55525C;
  --line:#17161A;
  --brand:#92308D;
  --brand-deep:#6B1F68;
  --c-plum:#92308D;
  --c-blue:#2F4BB8;
  --c-teal:#1F6F63;
  --c-clay:#C6382C;
  --c-amber:#E8A21F;
  --ok:#167A5B;
  --no:#C6382C;
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans KR","Bricolage Grotesque",system-ui,sans-serif;
  font-size:17px;
  line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(var(--ink) .6px,transparent .6px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.16),transparent 60%);
          mask-image:linear-gradient(180deg,rgba(0,0,0,.16),transparent 60%);
}
.en{font-family:"Bricolage Grotesque","Noto Sans KR",sans-serif;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c-blue);outline-offset:2px}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:var(--paper);
  border-bottom:3px solid var(--ink);
}
.bar{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brandmark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.1;margin-right:auto}
.brandmark small{display:block;font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:11px;opacity:.7;letter-spacing:0}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:4px;border-radius:11px}
.tabs button{
  border:0;background:transparent;color:var(--paper);
  font-weight:700;font-size:15px;padding:8px 15px;border-radius:8px;
}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.purse{display:flex;gap:7px;width:100%;padding-top:2px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);
  border-radius:999px;padding:4px 11px 4px 8px;font-size:14px;font-weight:700;
}
.pill b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.pill .dot{width:15px;height:15px;border-radius:50%;display:block;border:1.5px solid var(--ink)}

main{max-width:760px;margin:0 auto;padding:18px 14px 64px;position:relative;z-index:1}
.hide{display:none !important}

/* ---------- panels ---------- */
.panel{
  background:var(--paper-2);border:2.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px 18px;margin-bottom:16px;
}
h2{font-size:23px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--ink-60);font-size:15px;margin:0 0 16px}

/* ---------- setup ---------- */
.fieldset{margin-bottom:18px}
.fieldset > p{font-weight:700;font-size:15px;margin:0 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;
  padding:9px 16px;font-weight:700;font-size:15px;transition:transform .1s,background .1s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:active{transform:translateY(1px)}
.mode-list{display:grid;gap:9px}
.mode{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 14px;
}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:var(--shadow-sm)}
.mode .key{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;
  background:var(--m,var(--c-amber));color:var(--ink);
}
.mode strong{display:block;font-size:16.5px}
.mode span{font-size:13.5px;opacity:.72;line-height:1.45}
.btn{
  display:block;width:100%;border:2.5px solid var(--ink);border-radius:12px;
  background:var(--brand);color:#fff;font-weight:800;font-size:19px;padding:15px;
  box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.sm{font-size:16px;padding:11px;box-shadow:var(--shadow-sm)}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tag{
  font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;
  border:2px solid var(--ink);background:var(--qc,var(--c-amber));color:var(--ink);
}
.meter{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink-60)}
.meter b{font-family:"Bricolage Grotesque",sans-serif;color:var(--ink);font-size:16px}
.stage{
  border:2.5px solid var(--line);border-radius:var(--r);background:var(--paper-2);
  box-shadow:var(--shadow);padding:26px 18px;margin-bottom:14px;
  border-top:9px solid var(--qc,var(--c-amber));
}
.ask{font-size:14px;font-weight:700;color:var(--ink-60);margin:0 0 12px}
.word{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(34px,10vw,52px);line-height:1.12;letter-spacing:-.03em;
  margin:0;overflow-wrap:anywhere;
}
.pos{font-size:15px;font-weight:700;color:var(--ink-60);margin:6px 0 0}
.mean{font-size:clamp(26px,7.5vw,38px);font-weight:900;line-height:1.3;margin:0;overflow-wrap:anywhere}
.sentence{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:500;
  font-size:clamp(21px,5.6vw,29px);line-height:1.5;margin:0;overflow-wrap:anywhere;
}
.sentence .gap{
  display:inline-block;min-width:82px;border-bottom:4px solid var(--qc,var(--c-amber));
  vertical-align:-3px;margin:0 3px;
}
.sentence .gap.filled{border-bottom-color:var(--ink);font-weight:800}
.hintko{margin:14px 0 0;font-size:15px;color:var(--ink-60);font-weight:500}

.options{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  border:2.5px solid var(--ink);border-radius:12px;background:var(--paper-2);
  padding:15px 15px;font-weight:700;font-size:19px;line-height:1.35;
  box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;
  overflow-wrap:anywhere;
}
.opt:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.opt .n{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:800;
  background:var(--paper);
}
.opt.eng{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.opt.is-ok{background:var(--ok);color:#fff}
.opt.is-ok .n{background:#fff;color:var(--ok)}
.opt.is-no{background:var(--no);color:#fff}
.opt.is-no .n{background:#fff;color:var(--no)}
.opt.dim{opacity:.42}
.opt[disabled]{cursor:default}

.result{
  margin-top:14px;border:2.5px solid var(--ink);border-radius:12px;padding:15px;
  background:var(--paper-2);box-shadow:var(--shadow-sm);
}
.result .verdict{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;margin-bottom:8px}
.result .verdict .mark{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:16px;font-weight:800;
}
.result .full{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;line-height:1.5;margin:0 0 6px}
.result .full u{text-decoration:none;background:#FFE9A8;padding:0 4px;border-bottom:3px solid var(--c-amber);font-weight:800}
.result .k{font-size:16px;font-weight:700;margin:0}
.result .note{font-size:13.5px;color:var(--ink-60);margin:9px 0 0}
.result .coin{font-size:15px;font-weight:800;color:var(--c-amber)}

.streak{display:inline-flex;gap:3px;align-items:center;margin-left:2px}
.streak i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.18;display:block}
.streak i.on{opacity:1;background:var(--c-amber)}

/* ---------- collection ---------- */
.collection{margin-top:4px}
.gems{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gem{
  border:2px solid var(--ink);border-radius:11px;background:var(--paper);
  padding:7px 3px 6px;text-align:center;
}
.gem svg{width:100%;height:auto;max-width:46px;display:block;margin:0 auto}
.gem figcaption{font-size:11.5px;font-weight:700;margin-top:3px;line-height:1.2}
.gem.locked{opacity:.3}
.gem.locked figcaption{color:var(--ink-60)}

/* ---------- wordbook ---------- */
.wb-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.wb-actions .btn{width:auto;flex:1 1 150px}
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.witem{
  border:2px solid var(--ink);border-radius:12px;background:var(--paper-2);
  padding:13px 14px;box-shadow:var(--shadow-sm);
}
.wtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.wtop .w{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.wtop .tries{
  font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:999px;
  padding:1px 9px;background:#FFE9A8;
}
.wtop .del{margin-left:auto;border:2px solid var(--ink);background:var(--paper);border-radius:9px;padding:4px 10px;font-size:13px;font-weight:700}
.wmean{font-size:18px;font-weight:700;margin:5px 0 0}
.wex{font-family:"Bricolage Grotesque",sans-serif;font-size:15.5px;color:var(--ink-60);margin:7px 0 0;line-height:1.45}
.empty{text-align:center;padding:34px 12px}
.empty p{font-size:17px;font-weight:700;margin:0 0 6px}
.empty span{color:var(--ink-60);font-size:15px}

textarea{
  width:100%;min-height:90px;border:2px solid var(--ink);border-radius:10px;padding:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--paper);color:var(--ink);
}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(23,22,26,.72);
  display:grid;place-items:center;padding:20px;
}
.modal{
  width:100%;max-width:360px;background:var(--paper-2);border:3px solid var(--ink);
  border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:24px 20px;text-align:center;
  animation:pop .34s cubic-bezier(.16,1,.3,1);
}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal .kicker{font-size:14px;font-weight:800;color:var(--ink-60);margin:0}
.modal h3{font-size:27px;margin:6px 0 2px;letter-spacing:-.02em}
.modal .gemwrap{width:130px;margin:12px auto 8px}
.modal .gemwrap svg{width:100%;height:auto}
.modal p.msg{font-size:15px;color:var(--ink-60);margin:4px 0 18px}
.coupon{
  border:3px dashed var(--ink);border-radius:14px;padding:18px 12px;margin:14px 0 18px;background:#FFF6DC;
}
.coupon .big{font-size:26px;font-weight:900;letter-spacing:-.02em}
.coupon .small{font-size:14px;color:var(--ink-60);margin-top:4px}

footer{max-width:760px;margin:0 auto;padding:6px 16px 30px;color:var(--ink-60);font-size:13px;text-align:center;position:relative;z-index:1}

@media (min-width:560px){
  body{font-size:18px}
  .options{grid-template-columns:1fr 1fr}
  .wb-actions .btn{flex:0 1 auto;padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .opt:active,.btn:active{transform:none}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brandmark">단어 퀘스트<small>씬잉글리쉬 스튜디오</small></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-game" aria-selected="true" aria-controls="view-game">게임</button>
      <button role="tab" id="tab-book" aria-selected="false" aria-controls="view-book">내 단어장</button>
    </div>
    <div class="purse">
      <span class="pill"><span class="dot" style="background:#E8A21F"></span>코인 <b id="p-coin">0</b></span>
      <span class="pill"><span class="dot" style="background:#5AC8E8"></span>보석 <b id="p-gem">0</b>/10</span>
      <span class="pill"><span class="dot" style="background:#D98CD4"></span>소원쿠폰 <b id="p-cpn">0</b></span>
    </div>
  </div>
</header>

<main>
  <!-- ============ GAME ============ -->
  <section id="view-game" role="tabpanel" aria-labelledby="tab-game">

    <!-- setup -->
    <div class="panel" id="setup">
      <h2>오늘도 한 판 해볼까?</h2>
      <p class="sub">문제를 맞히면 코인 1개. 코인 10개마다 보석 카드를 한 장 뽑아요.</p>

      <div class="fieldset">
        <p>어떤 방식으로 풀까?</p>
        <div class="mode-list" id="modes">
          <button class="mode" data-mode="ko" style="--m:#F2C14E" aria-pressed="true">
            <span class="key">뜻</span>
            <span><strong>단어 뜻 맞히기</strong><span>영어 단어를 보고 한국어 뜻 고르기 + 예문 빈칸에 들어갈 영어 단어 고르기</span></span>
          </button>
          <button class="mode" data-mode="en" style="--m:#9FC7F5" aria-pressed="false">
            <span class="key">EN</span>
            <span><strong>영어 단어 맞히기</strong><span>한국어 뜻을 보고 영어 단어 고르기 + 예문 빈칸 자리의 뜻 고르기</span></span>
          </button>
          <button class="mode" data-mode="mix" style="--m:#C9AEE8" aria-pressed="false">
            <span class="key">MIX</span>
            <span><strong>두 가지 섞어서</strong><span>네 가지 문제 유형이 번갈아 나와요. 실전용!</span></span>
          </button>
        </div>
      </div>

      <div class="fieldset">
        <p>단원 고르기</p>
        <div class="chips" id="units">
          <button class="chip" data-unit="0" aria-pressed="true">전체</button>
          <button class="chip" data-unit="1" aria-pressed="false">1과</button>
          <button class="chip" data-unit="2" aria-pressed="false">2과</button>
          <button class="chip" data-unit="3" aria-pressed="false">3과</button>
          <button class="chip" data-unit="4" aria-pressed="false">4과</button>
        </div>
      </div>

      <button class="btn" id="start">시작하기</button>
      <p class="sub" style="margin:12px 0 0;text-align:center" id="poolinfo"></p>

      <div class="collection">
        <hr style="border:0;border-top:2px dashed var(--ink);opacity:.25;margin:20px 0 16px">
        <p style="font-weight:700;margin:0 0 10px">보석 카드 <span id="gemcount" style="color:var(--ink-60);font-weight:500"></span></p>
        <div class="gems" id="gems"></div>
        <button class="btn sm ghost hide" id="exchange" style="margin-top:12px">소원 쿠폰으로 바꾸기</button>
      </div>
    </div>

    <!-- quiz -->
    <div id="quiz" class="hide">
      <div class="qhead">
        <span class="tag" id="q-tag">뜻 고르기</span>
        <span class="streak" id="q-streak" aria-label="연속 정답"></span>
        <span class="meter">이번 판 <b id="q-score">0</b> / <b id="q-total">0</b></span>
      </div>
      <div class="stage" id="q-stage">
        <p class="ask" id="q-ask"></p>
        <div id="q-body"></div>
      </div>
      <div class="options" id="q-options"></div>
      <div id="q-result"></div>
      <button class="btn ghost sm" id="quit" style="margin-top:18px">그만하고 나가기</button>
    </div>
  </section>

  <!-- ============ WORDBOOK ============ -->
  <section id="view-book" role="tabpanel" aria-labelledby="tab-book" class="hide">
    <div class="panel">
      <h2>내 단어장</h2>
      <p class="sub" id="wb-sub">틀린 단어가 자동으로 모여요. 복습에서 두 번 맞히면 졸업!</p>
      <div class="wb-actions">
        <button class="btn sm" id="review">단어장으로 복습하기</button>
        <button class="btn sm ghost" id="backup">백업 / 복원</button>
      </div>
      <ul class="wlist" id="wlist"></ul>
      <div class="empty hide" id="wb-empty">
        <p>아직 틀린 단어가 없어요</p>
        <span>게임에서 틀린 단어는 여기에 자동으로 저장됩니다.</span>
      </div>
    </div>
  </section>
</main>

<footer>기록은 이 브라우저에 저장됩니다 · 씬잉글리쉬 스튜디오</footer>

<div id="modalRoot"></div>

<script>
/* =========================================================
   1. 단어 데이터
   ex 의 ___ 자리가 빈칸입니다. ex 가 없으면 뜻 문제로만 출제됩니다.
   ========================================================= */
const WORDS = [
/* ---- 1과 ---- */
{u:1,en:"must",pos:"aux.",ko:"~해야 한다",ex:"You ___ wash your hands before you eat."},
{u:1,en:"may",pos:"aux.",ko:"~해도 되다",ex:"___ I use your phone for a minute?"},
{u:1,en:"on the phone",pos:"",ko:"전화로",ex:"My sister talks with her friend ___ every night."},
{u:1,en:"terribly",pos:"adv.",ko:"몹시, 대단히",ex:"I am ___ sorry about the broken window."},
{u:1,en:"turn ~ off",pos:"",ko:"~을 끄다, 잠그다",ex:"Please ___ the TV before you go to bed."},
{u:1,en:"text",pos:"v.",ko:"문자를 보내다",ex:"I will ___ you the address later."},
{u:1,en:"touch",pos:"v.",ko:"만지다",ex:"Do not ___ the paintings in the museum."},
{u:1,en:"golden",pos:"a.",ko:"황금빛의",ex:"The evening sky turned ___ and pink."},
{u:1,en:"anything",pos:"pron.",ko:"아무것도",ex:"I did not eat ___ for lunch today."},
{u:1,en:"run",pos:"v.",ko:"달리다",note:"run-ran-run",ex:"I ___ to school every morning."},
{u:1,en:"sign",pos:"n.",ko:"표지판",ex:"The ___ at the door says 'No Photos'."},
{u:1,en:"inside",pos:"prep./adv.",ko:"~안에; 안으로",ex:"It is raining, so let us play ___."},
{u:1,en:"take",pos:"v.",ko:"가지고 가다",note:"take-took-taken",ex:"Do not forget to ___ your umbrella with you."},
{u:1,en:"bring",pos:"v.",ko:"가져오다",note:"bring-brought-brought",ex:"Please ___ your textbook to class tomorrow."},
{u:1,en:"only",pos:"adv.",ko:"오직",ex:"I have ___ one ticket for the concert."},
{u:1,en:"bottled",pos:"a.",ko:"병에 담은",ex:"She bought two ___ waters at the store."},
{u:1,en:"sunflower",pos:"n.",ko:"해바라기",ex:"Van Gogh painted a famous picture of a ___."},
{u:1,en:"favorite",pos:"a.",ko:"가장 좋아하는",ex:"Pizza is my ___ food in the world."},
{u:1,en:"painting",pos:"n.",ko:"그림",ex:"That ___ on the wall is over 100 years old."},
{u:1,en:"take a picture",pos:"",ko:"사진을 찍다",ex:"Can you ___ of me in front of the tower?"},

function gemSVG(c,d){
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="#17161A" stroke-width="4" stroke-linejoin="round">
      <path d="M30 18 H70 L88 44 L50 90 L12 44 Z" fill="${c}"/>
      <path d="M30 18 L38 44 H12 Z" fill="${d}"/>
      <path d="M70 18 L62 44 H88 Z" fill="${d}"/>
      <path d="M38 44 H62 L50 90 Z" fill="${d}" opacity=".55"/>
      <path d="M12 44 H88" fill="none"/>
      <path d="M38 44 L30 18 M62 44 L70 18" fill="none"/>
    </g>
  </svg>`;
}

/* =========================================================

   ========================================================= */
const KEY="ssiny-word-quest-v1";
const DEF={coins:0,earned:0,cards:[],coupons:0,book:{},solved:0,correct:0};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return {...DEF};
    return Object.assign({},DEF,JSON.parse(raw));
  }catch(e){ return {...DEF}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* 저장 공간이 없어도 게임은 계속 */ }
}

const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const rand = n=>Math.floor(Math.random()*n);
const pick = a=>a[rand(a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }

function paintPurse(){
  $("#p-coin").textContent = S.coins;
  $("#p-gem").textContent  = S.cards.length;
  $("#p-cpn").textContent  = S.coupons;
}
function paintGems(){
  $("#gems").innerHTML = CARDS.map(c=>{
    const has = S.cards.includes(c.id);
    return `<figure class="gem${has?"":" locked"}">
      ${gemSVG(has?c.c:"#D8D4CC", has?c.d:"#B4AFA6")}
      <figcaption>${has?esc(c.ko):"？"}</figcaption>
    </figure>`;
  }).join("");
  $("#gemcount").textContent = `${S.cards.length} / 10 모음`;
  $("#exchange").classList.toggle("hide", S.cards.length<10);
}

   6. 모달
   ========================================================= */
function modal(html, onClose){
  const root=$("#modalRoot");
  root.innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{ root.innerHTML=""; if(onClose) onClose(); };
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close));
  const first = root.querySelector("button"); if(first) first.focus();
  return close;
}

function drawCard(){
  const left = CARDS.filter(c=>!S.cards.includes(c.id));
  if(!left.length) return;
  S.coins -= 10;
  const got = pick(left);
  S.cards.push(got.id);
  save(); paintPurse(); paintGems();
  const done = S.cards.length===10;
  modal(`
    <p class="kicker">코인 10개를 모았어요</p>
    <h3>${esc(got.ko)} 획득!</h3>
    <div class="gemwrap">${gemSVG(got.c,got.d)}</div>
    <p class="msg">${done?"열 장을 모두 모았어요! 소원 쿠폰으로 바꿀 수 있어요.":`앞으로 ${10-S.cards.length}장 남았어요.`}</p>
    <button class="btn" data-close>좋았어!</button>
  `);
}

function exchangeCoupon(){
  modal(`
    <p class="kicker">보석 10장 전부 모음</p>
    <h3>소원 쿠폰으로 바꿀까요?</h3>
    <p class="msg">모은 보석 카드는 사라지고, 소원 쿠폰 1개를 받아요. 카드는 처음부터 다시 모을 수 있어요.</p>
    <button class="btn" id="doEx">바꿀래요</button>
    <button class="btn ghost sm" data-close style="margin-top:9px">조금 더 모을래요</button>
  `);
  $("#doEx").addEventListener("click",()=>{
    S.cards=[]; S.coupons++; save(); paintPurse(); paintGems();
    modal(`
      <p class="kicker">교환 완료</p>
      <h3>소원 쿠폰 ${S.coupons}장</h3>
      <div class="coupon"><div class="big">소원 쿠폰</div><div class="small">선생님께 보여주고 소원 하나를 말해요</div></div>
      <button class="btn" data-close>확인</button>
    `);
  });
}

function startGame(list, review){
  if(list.length<4){
    modal(`<h3>단어가 모자라요</h3><p class="msg">문제를 만들려면 단어가 4개 이상 필요해요.</p><button class="btn" data-close>확인</button>`);
    return;
  }
  pool=list; reviewMode=review; recent=[];
  session={n:0, ok:0, streak:0};
  $("#setup").classList.add("hide");
  $("#quiz").classList.remove("hide");
  showTab("game");
  nextQuestion();
}

function nextQuestion(){
  locked=false;
  $("#q-result").innerHTML="";
  // 최근에 나온 단어는 잠시 피하기
  let w, guard=0;
  do{ w=pick(pool); guard++; }while(recent.includes(w.en) && guard<25);
  recent.push(w.en); if(recent.length>Math.min(8,pool.length-1)) recent.shift();

  // 유형 결정
  let m = mode==="mix" ? (Math.random()<.5?"ko":"en") : mode;
  const blank = !!w.ex && Math.random()<.5;
  let type;
  if(m==="ko") type = blank ? "eb" : "km";
  else         type = blank ? "kb" : "ew";

  // 보기 만들기
  const others = shuffle(WORDS.filter(x=>x.en!==w.en));
  const same = others.filter(x=>x.pos && x.pos===w.pos);
  const picks=[];
  for(const src of [same, others]){
    for(const c of src){
      if(picks.length>=3) break;
      if(picks.some(p=>p.en===c.en)) continue;
      if(type==="km"||type==="kb"){ if(picks.some(p=>p.ko===c.ko) || c.ko===w.ko) continue; }
      else { if(c.blank===w.blank) continue; }
      picks.push(c);
    }
  }
  const answerIsEnglish = (type==="eb"||type==="ew");
  const opts = shuffle([w,...picks]).map(x=>({
    en:x.en,
    label: answerIsEnglish ? x.en : x.ko,
    ok: x.en===w.en
  }));

  q={w,type,opts};
  paintQuestion();
}

function paintQuestion(){
  const {w,type,opts}=q, T=TYPES[type];
  $("#q-stage").style.setProperty("--qc", T.color);
  $("#q-tag").style.setProperty("--qc", T.color);
  $("#q-tag").textContent = (reviewMode?"복습 · ":"") + T.tag;
  $("#q-ask").textContent = T.ask;
  $("#q-score").textContent = session.ok;
  $("#q-total").textContent = session.n;
  $("#q-streak").innerHTML = [0,1,2].map(i=>`<i class="${i<Math.min(session.streak,3)?"on":""}"></i>`).join("");

  let body="";
  if(type==="km"){
    body = `<p class="word">${esc(w.en)}</p>${w.pos?`<p class="pos">${esc(w.pos)}</p>`:""}`;
  }else if(type==="ew"){
    body = `<p class="mean">${esc(w.ko)}</p>${w.pos?`<p class="pos">${esc(w.pos)}</p>`:""}`;
  }else{
    body = `<p class="sentence">${sentenceHTML(w,false)}</p>`;
    if(type==="eb") body += `<p class="hintko">힌트 · ${esc(w.ko)}</p>`;
  }
  $("#q-body").innerHTML = body;

  $("#q-options").innerHTML = opts.map((o,i)=>
    `<button class="opt${(type==="eb"||type==="ew")?" eng":""}" data-i="${i}">
       <span class="n">${i+1}</span><span>${esc(o.label)}</span>
     </button>`).join("");
  $$("#q-options .opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
}

function sentenceHTML(w, filled){
  const parts = w.ex.split("___");
  const gap = filled
    ? `<span class="gap filled">${esc(w.blank)}</span>`
    : `<span class="gap">&nbsp;</span>`;
  return esc(parts[0]) + gap + esc(parts[1]||"");
}

function answer(i){
  if(locked) return; locked=true;
  const {w,opts,type}=q;
  const chosen=opts[i];
  session.n++;
  const btns=$$("#q-options .opt");
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(opts[j].ok) b.classList.add("is-ok");
    else if(j===i) b.classList.add("is-no");
    else b.classList.add("dim");
  });

  let earnedCoin=false, drew=false;
  if(chosen.ok){
    session.ok++; session.streak++;
    S.coins++; S.earned++; S.correct++; S.solved++;
    earnedCoin=true;
    if(S.book[w.en]){
      S.book[w.en].left--;
      if(S.book[w.en].left<=0) delete S.book[w.en];
    }
  }else{
    session.streak=0; S.solved++;
    const e=S.book[w.en] || (S.book[w.en]={miss:0,left:2,at:Date.now()});
    e.miss++; e.left=2; e.at=Date.now();
  }
  save(); paintPurse();
  $("#q-score").textContent=session.ok;
  $("#q-total").textContent=session.n;
  $("#q-streak").innerHTML=[0,1,2].map(k=>`<i class="${k<Math.min(session.streak,3)?"on":""}"></i>`).join("");

  // 예문 문제였다면 빈칸을 채워서 보여주기
  if(type==="eb"||type==="kb"){
    $("#q-body").querySelector(".sentence").innerHTML = sentenceHTML(w,true);
  }

  const mastered = chosen.ok && !S.book[w.en];
  $("#q-result").innerHTML = `
    <div class="result">
      <div class="verdict">
        <span class="mark" style="background:${chosen.ok?"var(--ok)":"var(--no)"}">${chosen.ok?"✓":"✕"}</span>
        ${chosen.ok?"정답!":"아쉬워요"}
        ${earnedCoin?`<span class="coin">+ 코인 1</span>`:""}
      </div>
      ${w.ex?`<p class="full">${esc(w.ex.split("___")[0])}<u>${esc(w.blank)}</u>${esc(w.ex.split("___")[1]||"")}</p>`:""}
      <p class="k"><b class="en">${esc(w.en)}</b> · ${esc(w.ko)}${w.note?` <span style="color:var(--ink-60);font-weight:500">(${esc(w.note)})</span>`:""}</p>
      ${!chosen.ok?`<p class="note">이 단어는 <b>내 단어장</b>에 담았어요.</p>`
                 :(mastered?`<p class="note">단어장에서 졸업했어요! 🎉</p>`:"")}
      <button class="btn sm" id="next" style="margin-top:13px">다음 문제</button>
    </div>`;
  $("#next").addEventListener("click",()=>{
    if(S.coins>=10 && S.cards.length<10){ drawCard(); }
    if(reviewMode && Object.keys(S.book).length===0){ finish(true); return; }
    if(reviewMode){ pool = Object.keys(S.book).map(k=>byEn[k]).filter(Boolean); }
    nextQuestion();
  });
  $("#next").focus({preventScroll:true});
  $("#q-result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(cleared){
  $("#quiz").classList.add("hide");
  $("#setup").classList.remove("hide");
  paintGems();
  if(session.n===0) return;
  const rate = Math.round(session.ok/session.n*100);
  modal(`
    <p class="kicker">${cleared?"단어장 복습 완료":"이번 판 결과"}</p>
    <h3>${session.ok} / ${session.n} 정답</h3>
    <p class="msg">${cleared?"단어장을 모두 비웠어요. 정말 잘했어요!":`정답률 ${rate}% · 코인 ${session.ok}개를 받았어요.`}</p>
    <button class="btn" data-close>확인</button>
  `);
}
$("#quit").addEventListener("click",()=>finish(false));

/* =========================================================
   10. 내 단어장
   ========================================================= */
function bookList(){
  return Object.entries(S.book)
    .map(([en,v])=>({w:byEn[en], v}))
    .filter(x=>x.w)
    .sort((a,b)=> b.v.miss-a.v.miss || b.v.at-a.v.at);
}
function paintBook(){
  const list=bookList();
  $("#wb-empty").classList.toggle("hide", list.length>0);
  $("#review").disabled = list.length===0;
  $("#review").style.opacity = list.length? 1 : .45;
  $("#wb-sub").textContent = list.length
    ? `${list.length}개의 단어가 기다리고 있어요. 복습에서 두 번 맞히면 졸업!`
    : "틀린 단어가 자동으로 모여요. 복습에서 두 번 맞히면 졸업!";
  $("#wlist").innerHTML = list.map(({w,v})=>`
    <li class="witem">
      <div class="wtop">
        <span class="w">${esc(w.en)}</span>
        <span class="tries">틀림 ${v.miss}회 · 남은 ${v.left}회</span>
        <button class="del" data-del="${esc(w.en)}">지우기</button>
      </div>
      <p class="wmean">${esc(w.ko)}${w.pos?` <span style="font-size:14px;color:var(--ink-60)">${esc(w.pos)}</span>`:""}</p>
      ${w.ex?`<p class="wex">${esc(w.ex.replace("___", w.blank))}</p>`:""}
    </li>`).join("");
  $$("#wlist .del").forEach(b=>b.addEventListener("click",()=>{
    delete S.book[b.dataset.del]; save(); paintBook();
  }));
}
$("#review").addEventListener("click",()=>{
  let list = bookList().map(x=>x.w);
  if(!list.length) return;
  // 보기 4개를 위해 단어가 모자라면 전체에서 채움
  if(list.length<4){
    const extra = shuffle(WORDS.filter(w=>!list.includes(w))).slice(0,4-list.length);
    startGame(list.concat(extra), true);
  }else{
    startGame(list, true);
  }
});

/* ---- 백업 / 복원 ---- */
$("#backup").addEventListener("click",()=>{
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  modal(`
    <p class="kicker">기기를 바꿀 때</p>
    <h3>백업 / 복원</h3>
    <p class="msg">아래 코드를 복사해 두었다가, 새 기기에서 붙여넣고 [복원]을 누르세요.</p>
    <textarea id="bkcode" spellcheck="false">${esc(code)}</textarea>
    <button class="btn sm" id="bkcopy" style="margin-top:10px">코드 복사</button>
    <button class="btn sm ghost" id="bkload" style="margin-top:8px">붙여넣은 코드로 복원</button>
    <button class="btn sm ghost" data-close style="margin-top:8px">닫기</button>
  `);
  $("#bkcopy").addEventListener("click",async()=>{
    const t=$("#bkcode"); t.select();
    try{ await navigator.clipboard.writeText(t.value); $("#bkcopy").textContent="복사했어요!"; }
    catch(e){ document.execCommand("copy"); $("#bkcopy").textContent="복사했어요!"; }
  });
  $("#bkload").addEventListener("click",()=>{
    try{
      const data=JSON.parse(decodeURIComponent(escape(atob($("#bkcode").value.trim()))));
      S=Object.assign({},DEF,data); save();
      paintPurse(); paintGems(); paintBook();
      $("#bkload").textContent="복원 완료!";
    }catch(e){ $("#bkload").textContent="코드를 다시 확인해 주세요"; }
  });
});

/* =========================================================
   11. 시작
   ========================================================= */
paintPurse(); paintGems(); paintBook();
document.addEventListener("keydown",e=>{
  if($("#quiz").classList.contains("hide")) return;
  if(e.key>="1"&&e.key<="4"){
    const b=$$("#q-options .opt")[+e.key-1]; if(b&&!b.disabled) b.click();
  }
  if(e.key==="Enter"){ const n=$("#next"); if(n) n.click(); }
});
</script>
